name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: nu-openopc
    steps:
      - uses: actions/checkout@v4
        with:
          path: nu-openopc
      - name: Resolve immutable NU dependency release
        id: nu-release
        run: >
          python scripts/verify_nu_release_manifest.py
          --emit-github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: newunivers-company/nu-llm-routing-lib
          ref: ${{ steps.nu-release.outputs.llm_ref }}
          path: nu-llm-routing-lib
          token: ${{ secrets.NU_REPOS_READ_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: newunivers-company/nu-resource-gen-lib
          ref: ${{ steps.nu-release.outputs.resource_ref }}
          path: nu-resource-gen-lib
          token: ${{ secrets.NU_REPOS_READ_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.4"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev --extra nu
      - name: Verify immutable NU source release
        run: >
          uv run python scripts/verify_nu_release_manifest.py
          --workspace-root ..
          --check-installed
      - name: Verify NU stable package contracts
        run: uv run python scripts/verify_nu_compatibility.py
      - name: Verify NU wheel-only package contracts
        run: |
          NU_WHEEL_ROOT="$RUNNER_TEMP/openopc-nu-wheels"
          uv build --project ../nu-llm-routing-lib --wheel --out-dir "$NU_WHEEL_ROOT/llm"
          uv build --project ../nu-resource-gen-lib --wheel --out-dir "$NU_WHEEL_ROOT/resource"
          uv venv "$NU_WHEEL_ROOT/venv" --python 3.12
          uv pip install --python "$NU_WHEEL_ROOT/venv/bin/python" \
            "$NU_WHEEL_ROOT"/llm/*.whl "$NU_WHEEL_ROOT"/resource/*.whl
          "$NU_WHEEL_ROOT/venv/bin/python" scripts/verify_nu_compatibility.py
      - run: uv run ruff check --select E9,F601,F63,F7,F82 opc tests scripts
      - run: uv run pytest -q -p no:cacheprovider
      - name: Validate versioned outcome benchmark contract
        run: uv run opc ops benchmark validate
      - name: Smoke the campaign harness plan and dry-run contract
        run: |
          uv run opc ops benchmark plan --campaign-id ci-smoke \
            --output "$RUNNER_TEMP/ci-campaign-plan.json" > /dev/null
          SLOT_ID="$(uv run python -c "import json,os;print(json.load(open(os.environ['RUNNER_TEMP']+'/ci-campaign-plan.json'))['slots'][0]['slot_id'])")"
          uv run opc ops benchmark run-slot "$SLOT_ID" \
            --plan "$RUNNER_TEMP/ci-campaign-plan.json" --dry-run
      - name: Run repeatable operations golden loop
        run: |
          uv run python scripts/operations_golden_e2e.py \
            --iterations 20 \
            --output-dir "$RUNNER_TEMP/openopc-operations-golden" \
            > "$RUNNER_TEMP/openopc-operations-golden.stdout.json"
      - name: Enforce operations scorecard regression gate
        run: >
          uv run python scripts/operations_regression_gate.py
          --baseline tests/fixtures/operations_scorecard_baseline.json
          --candidate tests/fixtures/operations_scorecard_candidate.json
          --maximum-regression 0.05
      - run: uv build

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: nu-openopc/opc/plugins/office_ui/frontend_src
    steps:
      - uses: actions/checkout@v4
        with:
          path: nu-openopc
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nu-openopc/opc/plugins/office_ui/frontend_src/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
