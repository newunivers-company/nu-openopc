name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: nu-openopc
    steps:
      - uses: actions/checkout@v4
        with:
          path: nu-openopc
      - uses: actions/checkout@v4
        with:
          repository: newunivers-company/nu-llm-routing-lib
          path: nu-llm-routing-lib
          token: ${{ secrets.NU_REPOS_READ_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: newunivers-company/nu-resource-gen-lib
          path: nu-resource-gen-lib
          token: ${{ secrets.NU_REPOS_READ_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.4"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev --extra nu
      - run: uv run ruff check --select E9,F601,F63,F7,F82 opc tests
      - run: uv run pytest -q -p no:cacheprovider
      - run: uv build

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: nu-openopc/opc/plugins/office_ui/frontend_src
    steps:
      - uses: actions/checkout@v4
        with:
          path: nu-openopc
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nu-openopc/opc/plugins/office_ui/frontend_src/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
