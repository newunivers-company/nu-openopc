# LLM config template: no API keys committed. Set api_key or api_key_env after opc init.
llm:
  default_model: "openai/gpt-5.4"
  api_base: "https://openrouter.ai/api/v1"
  api_key: ""
  # api_key_env: "OPENROUTER_API_KEY"

  temperature: 1
  max_tokens: 32768
  routing: {}
  fallback: {}
  nu_routing:
    enabled: true
    # Uses NU_LLM_ROUTER_CONFIG when set. In a sibling source checkout OpenOPC
    # auto-discovers ../nu-llm-routing-lib/configs/byteplus.production.json.
    config_path: ""
    fail_open: true
    # nu-llm-routing-lib does not carry tool-call response envelopes itself.
    # Keep tool turns on OpenOPC's explicitly configured LiteLLM model until a
    # target endpoint has been verified for the OpenAI tool-call protocol.
    apply_to_tool_calls: false
    sandboxed_tools: false
    hardware_profile: ""
    # Always provide a deterministic value so route planning never probes
    # nvidia-smi implicitly. Raise this only for an audited local GPU runtime.
    gpu_free_vram_mib: 0
    max_candidates: 4
    allowed_providers: []
    workload_map:
      coding: coding
      quick_tasks: structured_output

  # Optional: total input context window, used as the denominator for the
  # context-usage ring and to trigger auto-summarization. Auto-detected via
  # litellm for most OpenAI / Anthropic models; models litellm cannot map
  # (e.g. deepseek/doubao/glm or proxy / self-hosted endpoints) fall back to
  # 128000. Set this only when the fallback is wrong for your model.
  # Scalar applies to the default model:
  # context_window: 200000
  # Or per-model (wins over the scalar); keys are matched by model name:
  # context_window_overrides:
  #   gpt-5.4: 400000
  #   claude-sonnet-4.5: 200000
